spring.application.name=accounts-service
server.port=8080

# OPA sidecar (option B calls it directly)
opa.url=${OPA_URL:http://localhost:8181}

# Virtual threads: the blocking OPA call does not tie up a platform thread.
spring.threads.virtual.enabled=true

# Swagger UI: http://localhost:8080/swagger-ui.html (spec: /v3/api-docs)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=false

# Actuator: only health and info over HTTP, with liveness/readiness groups.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
